name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Vite only inlines VITE_ variables into the browser bundle. Keep the
          # public Supabase values under that prefix at build time.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://your-project.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_xxxxxxxxxxxxxxxxxxxx' }}
        run: npm run build
